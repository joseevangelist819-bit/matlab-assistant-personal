[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-assistant-personal"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
workflow = "workflow_engine.cli:main"
matlab-agent = "workflow_engine.matlab_agent_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workflow_engine*"]

[tool.setuptools.package-data]
workflow_engine = ["migrations/*.sql"]
